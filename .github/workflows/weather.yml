name: weather (도시별 날씨)
on:
  schedule:   # 2026-11-02 대표 승인으로 자동 수집 켬
    - cron: "40 20 * * *"    # 05:40
    - cron: "50 22 * * *"    # 07:50
    - cron: "20 2 * * *"     # 11:20
    - cron: "20 8 * * *"     # 17:20
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: weather, cancel-in-progress: false }
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p logs; : > logs/weather.txt
          for pair in 대전동구:djdonggu 대전중구:djjunggu 대전서구:djseogu 유성:yuseong 대덕:daedeok; do
            c=${pair%%:*}; d=${pair##*:}; rm -rf output; mkdir -p output
            CITY=$c python -u weather.py 2>&1 | tee -a logs/weather.txt; python3 tools/gate.py --city $d --in output --out data/$d --only weather.json --review review/$d || echo "::warning::$c 날씨 검문 실패"   # 날씨 항목만 갱신(다른 자료 상태는 보존, 2026-11-03)
          done
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs; [ -d review ] && git add review; git diff --cached --quiet && exit 0
          git commit -m "날씨 업데이트"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && ok=1 && break; sleep $((i*5)); done
          [ "$ok" = 1 ] || { echo "::error::날씨 올리기(push) 실패"; exit 1; }
