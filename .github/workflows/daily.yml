name: daily (도시별 하루 수집)
# 매일 새벽 5시 30분(한국시간)에 대전 5개 구마다 학교·급식·학원·유치원·도서관·인기도서를 모은다 (2026-11-02 대전판)
on:
  schedule:   # 2026-11-02 대표 승인으로 자동 수집 켬
    - cron: "30 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3      # 도시 50곳 — 3곳씩. 도서관 정보나루 하루 요청 한도를 넘지 않게 천천히
      matrix:
        include:
          - { city: 대전동구, d: djdonggu }
          - { city: 대전중구, d: djjunggu }
          - { city: 대전서구, d: djseogu }
          - { city: 유성, d: yuseong }
          - { city: 대덕, d: daedeok }
    env:
      CITY: ${{ matrix.city }}
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      KINDER_KEY: ${{ secrets.KINDER_KEY }}
      CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
      LIB_KEY: ${{ secrets.LIB_KEY }}
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
      TOUR_KEY: ${{ secrets.TOUR_KEY || secrets.WEATHER_KEY }}   # 공공데이터포털 키는 계정당 하나 (관광공사 API 활용신청만 하면 됨)
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}   # 서울 열린데이터광장 (서울 구 문화행사·공공예약)
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}   # 공공데이터포털 (도서관 표준데이터)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집
        run: |
          mkdir -p output && cp data/${{ matrix.d }}/*.json output/ 2>/dev/null || true   # 실패한 수집기는 이전 파일 유지
          mkdir -p logs; for s in collect academies kinder meals libs books events jobs sports deals; do
            echo "::group::$s"; f=$(python3 -c "import city;print(city.SCRIPTS.get('$s','$s'))"); timeout 1500 python -u $f.py 2>&1 | tee -a logs/daily-${{ matrix.d }}.txt || echo "::warning::${{ matrix.city }} $s 실패 (이전 파일 유지)"; echo "::endgroup::"
          done
          if [ "$(date +%d)" = "01" ] || [ ! -f output/elite.json ]; then python -u elite.py || true; fi   # 매달 1일 + 아직 없는 도시는 바로
      - name: 저장
        run: |
          python3 tools/gate.py --city ${{ matrix.d }} --in output --out data/${{ matrix.d }}   # 검문: 미확인·만료·형식 오류는 공개 안 함(직전본 유지)
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.d }} logs/daily-${{ matrix.d }}.txt 2>/dev/null || git add data/${{ matrix.d }}; git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.city }} 하루 수집"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
