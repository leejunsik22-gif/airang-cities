name: hospitals (동네 병원 — 의원·병원·응급실)
on:
  schedule:   # 2026-11-02 대표 승인으로 자동 수집 켬
    - cron: "50 19 * * 0"   # 매주 월요일 04:50 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: hospitals, cancel-in-progress: false }
jobs:
  hospitals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { city: 대전동구, d: djdonggu }
          - { city: 대전중구, d: djjunggu }
          - { city: 대전서구, d: djseogu }
          - { city: 유성, d: yuseong }
          - { city: 대덕, d: daedeok }
    env:
      CITY: ${{ matrix.city }}
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p output logs
          cp data/${{ matrix.d }}/hospitals.json output/ 2>/dev/null || true   # 실패하면 지난번 것을 그대로 쓰게
          cp data/${{ matrix.d }}/benefits.json output/ 2>/dev/null || true
          set -o pipefail
          python -u benefits.py 2>&1 | tee logs/benefits-${{ matrix.d }}.txt || true
          python -u hospitals.py 2>&1 | tee logs/hospitals-${{ matrix.d }}.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/hospitals-${{ matrix.d }}.txt logs/benefits-${{ matrix.d }}.txt
          python3 tools/gate.py --city ${{ matrix.d }} --in output --out data/${{ matrix.d }} && git add -A data/${{ matrix.d }}   # 검문 통과분만 공개
          git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.city }} 동네 병원·혜택"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
