<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>01 클래식 워드마크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif}
a{color:#B8641E}a:hover{color:#1F2A44}
</style>
</helmet>
<div style="width: 560px; height: 320px; box-sizing: border-box; background: #FBF6EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
  <div style="display: flex; align-items: baseline; gap: 2px; font-size: 96px; font-weight: 900; letter-spacing: -4px; line-height: 1; color: #1F2A44">
    <span style="color: #1F2A44">아이</span><span style="color: {{accent}}">랑</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px">
    <span style="display: block; width: 40px; height: 2px; background: #C9A86A"></span>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 6px; color: #6E645B">아이 키우는 집의 동네 정보</span>
    <span style="display: block; width: 40px; height: 2px; background: #C9A86A"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9822B","options":["#D9822B","#B8641E","#C9A86A","#2E8B57"]},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#D9822B' }; }
}
</script>
</body>
</html>
