<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>06 새싹</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif}
a{color:#2E8B57}a:hover{color:#1F2A44}
</style>
</helmet>
<div style="width: 560px; height: 320px; box-sizing: border-box; background: #FBF6EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
  <div style="display: flex; align-items: flex-end; gap: 0">
    <span style="font-size: 92px; font-weight: 900; letter-spacing: -4px; line-height: 1; color: #1F2A44">아이</span>
    <svg role="img" aria-label="두 잎 새싹" width="58" height="92" viewBox="0 0 58 92" fill="none" style="margin: 0 2px 6px -2px">
      <path d="M29 90 V38" stroke="#1F2A44" stroke-width="10" stroke-linecap="round"></path>
      <path d="M29 44 C29 24 16 12 2 12 C2 30 12 44 29 44 Z" fill="{{leaf}}"></path>
      <path d="M29 36 C29 16 42 4 56 4 C56 22 46 36 29 36 Z" fill="{{accent}}"></path>
    </svg>
    <span style="font-size: 92px; font-weight: 900; letter-spacing: -4px; line-height: 1; color: #1F2A44">랑</span>
  </div>
  <div style="font-size: 14px; font-weight: 700; letter-spacing: 5px; color: #6E645B; margin-top: 6px">아이와 함께 자라는 동네</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"leaf":{"editor":"color","default":"#2E8B57","options":["#2E8B57","#5E8C7A","#1F2A44"]},"accent":{"editor":"color","default":"#D9822B","options":["#D9822B","#C9A86A","#B8641E"]},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return { leaf: this.props.leaf ?? '#2E8B57', accent: this.props.accent ?? '#D9822B' }; }
}
</script>
</body>
</html>
