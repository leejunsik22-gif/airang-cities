<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>04 둥근 뱃지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif}
a{color:#B8641E}a:hover{color:#1F2A44}
</style>
</helmet>
<div style="width: 560px; height: 320px; box-sizing: border-box; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 24px">
  <div style="width: 220px; height: 220px; border-radius: 110px; background: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 14px 30px rgba(184,100,30,0.22)">
    <div style="font-family: 'Jua', sans-serif; font-size: 78px; line-height: 1; color: #FFFFFF; letter-spacing: -2px">아이랑</div>
    <div style="width: 52px; height: 3px; background: #FBF6EF; border-radius: 2px; margin-top: 8px"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Jua', sans-serif; font-size: 54px; line-height: 1; color: #1F2A44">아이랑</div>
    <div style="font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #6E645B">아이 키우는 집의<br>동네 정보</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9822B","options":["#D9822B","#B8641E","#1F2A44","#2E8B57"]},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#D9822B' }; }
}
</script>
</body>
</html>
