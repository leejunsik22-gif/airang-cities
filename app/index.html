<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{c.city}}">
<meta name="description" content="{{name}} 아이 키우는 집을 위한 급식·학교 일정·도서관·유치원·학원·행사 정보 모음">
{{#if yongin}}
{{#else}}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https://raw.githubusercontent.com https://*.goatcounter.com https://gc.zgo.at; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
{{/if}}
<meta name="apple-mobile-web-app-title" content="아이랑{{name}}">
<title>아이랑 {{name}}</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=60">
<link rel="apple-touch-icon" href="icon-192.png?v=60">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Gothic+A1:wght@800&display=swap">
<style>
:root{
  --ink:#141A2E;--muted:#5C6478;--line:#EEF0F6;--ground:#EEF1F8;
  --indigo:#4B5BF0;--indigo-ink:#3442C9;--coral-ink:#C93D22;--coral-bg:#FFE9E2;
  --mint-ink:#13795F;--mint-bg:#E2F6F0;--sun-ink:#8A5300;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input{font-family:inherit}
a{color:var(--indigo);text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 90% 4%,rgba(150,135,255,.38),transparent 42%),radial-gradient(circle at 0% 62%,rgba(110,220,195,.26),transparent 45%),var(--ground)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px calc(120px + env(safe-area-inset-bottom))}
.lift{background:#fff;border-radius:24px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,26,46,.05),0 14px 30px -12px rgba(43,52,120,.24)}
.glass{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.85)}
.tile{display:inline-flex;align-items:center;justify-content:center;color:#fff;border-radius:14px;flex:0 0 auto;box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.16),0 10px 18px -6px var(--sh)}
.t-indigo{background:linear-gradient(155deg,#9AA4FF,#5B6BFF 45%,#3B47D6);--sh:rgba(75,91,240,.6)}
.t-coral{background:linear-gradient(155deg,#FFBBA5,#FF7A59 50%,#DD4E33);--sh:rgba(255,122,89,.6)}
.t-mint{background:linear-gradient(155deg,#9BF0DC,#2FC4A4 50%,#16917A);--sh:rgba(43,181,154,.55)}
.t-sun{background:linear-gradient(155deg,#FFE9A6,#FFC53D 50%,#E79B00);--sh:rgba(240,170,20,.55)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:18px 10px}
.mgrid button{border:0;background:none;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0;position:relative}
.mgrid .tile{width:48px;height:48px;font-size:22px}
.mgrid b{font-size:12px;font-weight:700;line-height:1.3;text-align:center;word-break:keep-all}
.mgrid i{position:absolute;top:-6px;right:4px;font-style:normal;font-size:9px;font-weight:800;color:#8A5300;background:#FFE3A3;border-radius:6px;padding:1px 5px}
.t-lilac{background:linear-gradient(155deg,#E3C9FF,#AE7BFA 50%,#7E4ED8);--sh:rgba(167,116,242,.55)}
.orb-sun{border-radius:50%;background:radial-gradient(circle at 30% 26%,#fff 0%,#FFF1C4 14%,#FFD15A 45%,#F2A900 78%,#C98500 100%);box-shadow:0 18px 26px -12px rgba(30,10,80,.55)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fl{animation:float 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
.btn{border:none;border-radius:16px;height:46px;padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-3d{background:linear-gradient(180deg,#6876FF,#4B5BF0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #3340C4,0 12px 18px -8px rgba(75,91,240,.6)}
.btn-soft{background:linear-gradient(180deg,#fff,#F2F4FB);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 4px 0 #DCE0EE,0 10px 16px -8px rgba(43,52,120,.3)}
.btn:active{transform:translateY(3px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;font-size:13px;font-weight:700;color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.4px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.sec-head h2{font-size:19px;font-weight:800}
.sec-head a,.sec-head button{font-size:13px;font-weight:700;color:var(--indigo);background:none;border:none;cursor:pointer;padding:6px 0}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 22px;min-height:150px;color:#fff;background:linear-gradient(140deg,#5161F7,#6B55E8 55%,#8A5BE6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 26px 40px -18px rgba(75,91,240,.7)}
.hero .glow{position:absolute;left:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .date{font-size:12px;opacity:.85;font-weight:500}
.hero h1{font-size:21px;font-weight:800;line-height:1.35;margin-top:6px;max-width:72%;white-space:pre-line}
.hero .next{margin:6px 0 0;font-size:15px;font-weight:500;opacity:.92;max-width:62%;line-height:1.5}
.hero .cta{margin-top:12px;height:36px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.hero .deco{position:absolute;right:20px;top:20px}
.hero .dday{position:absolute;right:18px;bottom:20px;text-align:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:10px 14px;min-width:84px}
.hero .dday b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.hero .dday span{font-size:11px;opacity:.9}
.ev{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
a.ev{color:inherit;text-decoration:none}
.ev-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ev-tags .pill{font-size:11px;padding:3px 8px}
.datebox.city{background:var(--mint-bg)}.datebox.city b,.datebox.city span{color:var(--mint-ink)}
.datebox{width:54px;height:54px;border-radius:16px;flex:0 0 auto;background:linear-gradient(180deg,#fff,#EEF0FA);box-shadow:inset 0 -3px 0 #DDE1F0,0 6px 12px -6px rgba(43,52,120,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.datebox b{font-size:18px;font-weight:800;color:var(--indigo-ink);line-height:1.1}
.datebox span{font-size:10px;font-weight:700;color:var(--muted)}
.datebox.hol b{color:var(--coral-ink)}
.ev-body{flex:1;min-width:0}
.ev-name{font-size:15px;font-weight:700;line-height:1.4}
.ev-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:12px;white-space:nowrap}
.pill-coral{color:var(--coral-ink);background:var(--coral-bg)}
.pill-indigo{color:var(--indigo-ink);background:#ECEEFF}
.pill-mint{color:var(--mint-ink);background:var(--mint-bg)}
.pill-gray{color:#3A4256;background:#EEF0F6}
.card-pad{padding:6px 18px}
.empty{padding:18px;font-size:14px;color:var(--muted);line-height:1.7}
.soon{display:flex;gap:14px;align-items:center;padding:16px 18px}
.soon p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:18px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink)}
.school{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left;border:none;background:#fff;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.school:last-child{border-bottom:none}
.school .nm{font-size:15px;font-weight:700}
.school .ad{font-size:12px;color:var(--muted);margin-top:2px}
.school.mine{background:#F4F5FF}
.list{overflow:hidden}
.back{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}
.row .val{font-size:13px;color:var(--muted);text-align:right}
.foot{margin-top:26px;font-size:11px;color:var(--muted);line-height:1.7;text-align:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(524px,calc(100% - 28px));height:80px;border-radius:40px;display:flex;align-items:center;padding:0 6px;box-shadow:0 18px 40px -14px rgba(43,52,120,.38);z-index:10}
.navi{flex:1;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700;background:none;border:none;cursor:pointer}
.navi .ic{width:48px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:26px;transition:transform .2s}
.navi.on{color:var(--indigo-ink)}
.navi .ic img{width:32px;height:32px;transition:width .2s,height .2s}
.navi.on .ic{background:var(--pill);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 12px -6px rgba(40,50,120,.35);transform:translateY(-3px)}
.navi.on .ic img{width:36px;height:36px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#141A2E;color:#fff;font-size:13px;padding:10px 16px;border-radius:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.seatbar{height:12px;border-radius:6px;background:#EEF0F6;box-shadow:inset 0 2px 3px rgba(20,26,46,.12);overflow:hidden}
.seatbar i{display:block;height:100%;border-radius:6px}
.lib-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.room{display:flex;flex-direction:column;gap:6px}
.room-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.room-top b{font-size:20px;font-weight:800}
.seg{display:flex;background:#E4E8F2;border-radius:16px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(20,26,46,.08);margin:14px 0 16px}
.seg button{flex:1;height:40px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(20,26,46,.12)}
.book{display:flex;gap:14px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:0}
.book .rk{width:22px;text-align:center;font-size:16px;font-weight:800;color:var(--indigo);flex:0 0 auto}
.book .cv{width:52px;height:74px;border-radius:8px;object-fit:cover;background:#E4E8F2;box-shadow:0 6px 12px rgba(20,26,46,.18);flex:0 0 auto}
.book .tt{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .au{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.shelf a{flex:0 0 92px;text-decoration:none;color:inherit;position:relative}
.shelf img,.shelf .ph{width:92px;height:132px;border-radius:10px;object-fit:cover;background:#E4E8F2;box-shadow:0 8px 16px rgba(20,26,46,.18);display:block}
.shelf .no{position:absolute;left:6px;top:6px;min-width:22px;height:22px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.shelf .tt{font-size:12px;font-weight:700;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#F5F7FC;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:inset 0 1px 2px rgba(20,26,46,.06)}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:18px;font-weight:800;margin-top:2px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px}
.dots i{display:block;aspect-ratio:1;border-radius:3px;border:1.5px solid var(--dot);background:#fff}
.dots i.u{background:var(--dot);border-color:var(--dot-ink)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
.tbox input{border:1px solid var(--line)}.tbox input:invalid{border:1.5px dashed #9AA6F5;color:transparent}.tbox input:invalid::-webkit-datetime-edit{opacity:0}.tbox .ph{position:absolute;left:12px;top:0;line-height:44px;font-size:14px;font-weight:700;color:#6C78E0;pointer-events:none}.tbox input:valid+.ph{display:none}
.ic3d{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}.ic3d::after{content:"";position:absolute;bottom:-1px;left:50%;width:62%;height:16%;transform:translateX(-50%);border-radius:50%;background:rgba(40,50,110,.16);filter:blur(3px);z-index:0}.ic3d img{position:relative;z-index:1;filter:drop-shadow(0 5px 5px rgba(30,40,90,.16))}

/* ---- 3D 지역 디자인 (도시 색 · 입체 아이콘) ---- */
:root{--city:{{c.city}};--city-ink:{{c.ink}};--city-deep:{{c.deep}};--city-soft:{{c.soft}};--ground:#F7F5F0;--indigo:{{c.ink}};--indigo-ink:{{c.ink}}}
.bg{background:radial-gradient(circle at 92% 0%,{{c.soft}},transparent 46%),radial-gradient(circle at 0% 72%,rgba(255,232,196,.38),transparent 46%),var(--ground)}
.lift{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(40,32,16,.05),0 14px 30px -14px rgba(70,56,30,.22)}
.btn-3d{background:linear-gradient(180deg,{{c.city}},{{c.ink}});box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 {{c.deep}},0 12px 18px -8px {{c.city}}99}
.pill-indigo{color:{{c.ink}};background:{{c.soft}}}
.school.mine{background:{{c.soft}}}
.shelf .no{background:{{c.ink}}}
.navi.on{color:{{c.ink}}}
.navi.on .ic{background:{{c.soft}}}
.navi .ic img{width:30px;height:30px;object-fit:contain}
.navi.on .ic img{width:34px;height:34px}
.scape{padding:0;overflow:hidden;margin-bottom:2px}
.scape-img{display:block;width:100%;height:auto;aspect-ratio:12/5;background:linear-gradient(180deg,{{c.soft}},#fff)}
.scape-body{padding:2px 16px 14px;background:#fff}
.kidadd{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:6px 2px}
.kidadd b{font-size:16px;font-weight:800}
.kidadd small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kidadd .plus{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,{{c.city}},{{c.ink}});color:#fff;font-size:22px;font-weight:700;box-shadow:0 3px 0 {{c.deep}}}
.kidinfo .date{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.kidinfo h1{font-size:19px;font-weight:800;line-height:1.35;margin-top:4px;white-space:pre-line}
.kidinfo .next{font-size:14px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.kidinfo .dday{flex:0 0 auto;text-align:center;background:{{c.soft}};color:{{c.ink}};border-radius:16px;padding:8px 12px;min-width:76px}
.kidinfo .dday b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.kidinfo .dday span{font-size:11px;font-weight:700}
.libgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.libtile{min-width:0;display:flex;align-items:center;gap:8px;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:14px 10px 14px 12px;min-height:84px}
.libtile img{width:40px;height:40px;object-fit:contain;flex:0 0 auto}
.libtile .nm{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.libtile .chev{color:var(--muted);font-size:16px;flex:0 0 auto}
.mgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.mtile{border:0;font:inherit;color:var(--ink);background:#fff;border-radius:20px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:112px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(40,32,16,.05),0 12px 24px -14px rgba(70,56,30,.24)}
.mtile img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(60,40,10,.12))}
.mtile b{font-size:13.5px;font-weight:700;letter-spacing:-.2px;word-break:keep-all;text-align:center}
.mtile:active{transform:translateY(2px)}
@media (max-width:350px){.mtile img{width:56px;height:56px}.libgrid{grid-template-columns:1fr}}

/* ---- 모든 메뉴 맨 위 도시 풍경 (뒤로 가기·제목이 풍경 위에 올라감) ---- */
.topscape{position:absolute;left:0;right:0;top:0;max-width:560px;margin:0 auto;padding:12px 12px 0;pointer-events:none}
.topscape div{position:relative;height:168px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--city-soft),#fff)}
.topscape div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(247,245,240,.72) 66%,var(--ground) 100%)}
.topscape picture{display:block;width:100%;height:100%}.topscape img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.topscape:not([hidden]) + .wrap{position:relative;padding-top:24px}
.topscape:not([hidden]) + .wrap > .back:first-child{margin-left:-4px}
.topscape:not([hidden]) + .wrap > .back:first-child + h1{margin-top:54px !important}
.topscape:not([hidden]) + .wrap > h1:first-child{margin-top:98px !important}
.topscape:not([hidden]) + .wrap > .back:first-child + h1,.topscape:not([hidden]) + .wrap > h1:first-child{text-shadow:0 1px 0 #fff,0 0 14px rgba(255,255,255,.95),0 0 4px rgba(255,255,255,.9)}
@media (max-width:350px){.topscape div{height:150px}.topscape:not([hidden]) + .wrap > .back:first-child + h1{margin-top:40px !important}.topscape:not([hidden]) + .wrap > h1:first-child{margin-top:84px !important}}

/* ───────────────────────────────────────────────────────────────
   아이랑 브랜드 디자인 시스템 v1후보 (2026-11-02, 작업 가지 work)
   기본: 따뜻한 아이보리 + 깊은 네이비 / 보조: 절제된 코랄·세이지 / 골드 포인트 최소
   규칙: 글꼴 Noto Sans KR · 본문 15px/1.55 · 카드 곡률 20 · 버튼 곡률 14 · 터치 44px 이상
   이 파일은 각 화면의 기존 CSS "뒤에" 붙어 토큰과 공통 요소만 덮어쓴다(원본 CSS는 보존).
   ─────────────────────────────────────────────────────────────── */
:root{
  --ivory:#FAF7F1;--ivory-2:#F2EDE3;--paper:#FFFFFF;
  --navy:#1F2A44;--navy-ink:#16203A;--navy-soft:#E6E9F1;
  --coral:#D9654A;--coral-ink:#A33D27;--coral-bg:#FBE9E3;
  --sage:#5E8C7A;--sage-ink:#2E5A4B;--sage-bg:#E6F0EB;
  --gold:#B8923E;--gold-ink:#6F5415;--gold-bg:#F7EEDC;
  --ink:var(--navy-ink);--muted:#5B6274;--line:#E8E3D9;--ground:var(--ivory);
  --indigo:var(--navy);--indigo-ink:var(--navy-ink);--indigo-bg:var(--navy-soft);
  --mint-ink:var(--sage-ink);--mint-bg:var(--sage-bg);--sun-ink:var(--gold-ink);--sun-bg:var(--gold-bg);
  --card:var(--paper);
  --r-card:20px;--r-btn:14px;--r-chip:12px;
  --shadow:0 1px 2px rgba(31,42,68,.05),0 10px 24px -16px rgba(31,42,68,.28);
  --shadow-sm:0 1px 2px rgba(31,42,68,.06);
}
html,body{background:var(--ground)!important;color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
body{background-image:none!important}
.bg{background:var(--ground)!important}
a{color:var(--navy)}
h1,h2,h3{letter-spacing:-.3px;color:var(--navy-ink)}
/* 카드 */
.lift,.card,.pcard{background:var(--paper)!important;border-radius:var(--r-card)!important;box-shadow:var(--shadow)!important;border:1px solid rgba(31,42,68,.06)}
.glass{background:rgba(255,255,255,.82)!important;border:1px solid rgba(31,42,68,.08)!important;backdrop-filter:blur(14px)}
/* 버튼·칩: 터치 44px, 입체 효과 제거 */
.btn,.chip,.oc-tab,.ask,.navi,.seg button,button.btn-soft,button.btn-3d,a.btn{min-height:44px!important;border-radius:var(--r-btn)!important;font-weight:700;letter-spacing:-.2px}
.btn-3d{background:var(--navy)!important;color:#fff!important;box-shadow:0 6px 14px -8px rgba(31,42,68,.6)!important}
.btn-soft{background:var(--paper)!important;color:var(--navy)!important;box-shadow:var(--shadow-sm)!important;border:1px solid var(--line)}
.btn:active,.btn-3d:active,.btn-soft:active{transform:translateY(1px)}
.chip{background:var(--paper);border:1px solid var(--line)}
/* 아이콘 타일: 같은 굵기·같은 스타일(단색 + 연한 바탕) */
.tile,.t-indigo,.t-coral,.t-mint,.t-sun,.t-lilac{background:var(--navy-soft)!important;color:var(--navy)!important;box-shadow:none!important;border-radius:14px!important}
.t-coral{background:var(--coral-bg)!important;color:var(--coral-ink)!important}
.t-mint{background:var(--sage-bg)!important;color:var(--sage-ink)!important}
.t-sun{background:var(--gold-bg)!important;color:var(--gold-ink)!important}
.t-lilac{background:var(--navy-soft)!important;color:var(--navy)!important}
.orb-sun{background:radial-gradient(circle at 30% 26%,#fff 0%,#F7EEDC 30%,var(--gold) 100%)!important;box-shadow:none!important}
/* 히어로·제목 */
.hero{background:linear-gradient(140deg,var(--navy),#2B3A5C)!important;box-shadow:var(--shadow)!important;border-radius:var(--r-card)!important}
.sec-head h2{font-size:18px;font-weight:800}
.sec-head a,.sec-head button{color:var(--navy)}
/* 배지·태그: 골드는 '확인됨·NEW'에만 */
.pill-gray{background:var(--ivory-2);color:var(--muted)}
.pill-coral{background:var(--coral-bg);color:var(--coral-ink)}
/* 입력창 */
input[type=text],input[type=search],.search{min-height:44px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--paper)}
/* 하단 탭 */
.navi{min-height:48px!important;border-radius:14px!important}
/* 글자 대비: 작은 보조 글자는 muted 통일 */
.foot,.note,.sub{color:var(--muted)}
/* 움직임 줄이기 */
.fl{animation:none!important}
.bi-inl{display:inline-flex;vertical-align:-3px;margin-right:4px}.bi-inl .bi{color:currentColor}
.bi{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;color:var(--navy);flex:0 0 auto;vertical-align:middle}.bi svg{display:block}
.navi .ic .bi{color:var(--muted)}.navi.on .ic .bi{color:var(--navy)}
.navi.on{color:var(--navy)!important}.navi.on .ic{background:var(--navy-soft)!important;box-shadow:none!important;transform:none!important}
.mtile .bi{margin-bottom:2px}
.soon-head{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.mgrid-soon{gap:8px}.mgrid-soon .mtile-soon{background:var(--ivory-2)!important;box-shadow:none!important;border:1px dashed var(--line)!important;color:var(--muted);cursor:default;min-height:0!important;padding:10px 4px 10px!important;gap:3px}
.mgrid-soon .mtile-soon .bi{width:34px!important;height:34px!important}.mgrid-soon .mtile-soon .bi svg{width:20px;height:20px}.mgrid-soon .mtile-soon b{font-size:12px}
.mtile-soon .bi{color:var(--muted);background:transparent!important}
.mtile-soon .soon-tag{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:8px;padding:2px 7px;margin-top:2px}
.e-flat{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ivory-2);line-height:1;flex:0 0 auto}
/* 닫기(×)·공유 등 아이콘 버튼도 44px */
button[aria-label="닫기"]{min-width:44px!important;min-height:44px!important;display:inline-flex;align-items:center;justify-content:center;padding:0!important}
button[aria-label="지인에게 알려주기"]{width:44px!important;height:44px!important}
a.val{display:inline-flex;align-items:center;min-height:44px}
/* 입구 하단 안내 링크 */
.guides a,.seo-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:12px;background:var(--ivory-2);margin:4px 4px 0 0;font-size:13px;color:var(--navy)}
/* ═══════════════════════════════════════════════════════════════
   아이랑 브랜드 디자인 시스템 v2후보 (2026-11-03, 026 프리미엄 통합) — v1 뒤에 붙는다
   A 기본 디자인: 딥네이비·고급 아이보리·샴페인 골드 포인트·세이지/절제된 코랄 (012 토큰 유지)
   B 글씨체: Noto Sans KR 유지(지정 서체 없음) — 제목 800·자간 -0.5px / 본문 15px·줄 1.6 / 보조 12.5~13px
   C 전체 구성: 007 홈5(고요한 검색)+홈3(우리 아이 맞춤), 상세1(사진 히어로·출처·확인일), 준비 중 틀, 저장(즐겨찾기), 마이
   규칙: 카드 곡률 20 · 버튼 14 · 칩 12 · 터치 44px · 아이콘 선 1.75 단색 · 골드는 '확인됨·저장·강조'에만
   ═══════════════════════════════════════════════════════════════ */
:root{--gold-soft:#EFE3C6;--navy-2:#2B3A5C;--fs-h1:26px;--fs-h2:18px;--fs-body:15px;--fs-sub:12.5px;--shadow-lg:0 2px 4px rgba(31,42,68,.05),0 18px 40px -20px rgba(31,42,68,.35)}
body{font-size:var(--fs-body);line-height:1.6}
h1{font-size:var(--fs-h1)!important;font-weight:800;letter-spacing:-.5px;line-height:1.25}
h2{font-size:var(--fs-h2);font-weight:800;letter-spacing:-.3px}
.sub,.foot,.note,.ad,.d{font-size:var(--fs-sub)}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--gold-ink);background:var(--gold-bg);padding:3px 9px;border-radius:8px}
.card-pad{padding:16px 18px}
/* 공통 상단 바(v2): 로고·구 이름·다른 구 */
.topbar-v2{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.topbar-v2 .brand{font-size:19px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.topbar-v2 .by{font-size:11px;color:var(--muted)}
/* 검색 카드(홈5): 크고 조용하게 */
.search-v2{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow-lg)}
.search-v2 input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;min-height:48px;outline:none;color:var(--ink)}
.search-v2 input::placeholder{color:#6B7285}
.q-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.q-chips::-webkit-scrollbar{display:none}
.q-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-chip);background:var(--ivory-2);color:var(--navy);border:1px solid transparent;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.q-chip:active{background:var(--navy-soft)}
/* 섹션 머리 */
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sec-head .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--navy);background:none;border:0;min-height:44px;padding:0 6px;cursor:pointer}
/* 준비 중 틀 */
.soon-frame{border:1px dashed var(--gold);background:linear-gradient(180deg,#FFFDF8,var(--paper));border-radius:var(--r-card);padding:22px 20px;text-align:center}
.soon-frame .ic{margin:0 auto 10px}
.soon-frame h2{margin:0 0 6px}
.soon-frame p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.soon-frame .src{margin-top:12px;font-size:12.5px;color:var(--muted)}
.soon-frame .actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* 저장(즐겨찾기) */
.fav-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;flex:0 0 auto;font:inherit}
.fav-btn.on{background:var(--gold-bg);border-color:var(--gold-soft);color:var(--gold-ink)}
.fav-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fav-row:last-child{border-bottom:0}
.fav-row .t{flex:1;min-width:0}
.fav-row .t b{display:block;font-size:15px}
.fav-row .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 출처·확인일 줄 */
.src-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.src-line .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);margin-top:6px;flex:0 0 auto}
/* 상세 시트(상세1) */
.sheet-bg{position:fixed;inset:0;background:rgba(22,32,58,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:20px;margin:4px 0 2px}
.sheet .kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}
.sheet .kv b{color:var(--muted);font-weight:700}
.sheet .hours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sheet .hours div{background:var(--ivory-2);border-radius:10px;padding:8px 6px;text-align:center;font-size:12.5px}
.sheet .hours div b{display:block;font-size:12px;color:var(--muted)}
.sheet .hours div.today{background:var(--navy-soft);color:var(--navy)}
.sheet .acts{display:flex;gap:8px;margin-top:14px}
.sheet .acts .btn{flex:1;min-height:48px;text-decoration:none;justify-content:center}
/* 하단 탭 v2 */
.nav{background:rgba(255,255,255,.96)!important;border:1px solid var(--line)!important;border-radius:24px!important;height:72px!important;box-shadow:var(--shadow-lg)!important;backdrop-filter:blur(12px)}
.navi{height:70px!important;font-size:11.5px!important;color:var(--muted)!important}
.navi .ic{width:40px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:none}
.navi.on{color:var(--navy-ink)!important}
.navi.on .ic{background:var(--navy-soft)!important;box-shadow:none!important;transform:none!important}
/* 입구·구 카드 */
.gu-card{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-card);overflow:hidden}
/* 접근성: 초점 */
:focus-visible{outline:3px solid rgba(184,146,62,.6);outline-offset:2px}
/* 관리자 공통(같은 벌) */
.pnav.on{position:relative}
.pnav.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--gold)}
.psep{font-size:11px;letter-spacing:.4px;color:#9AA3B8;margin:14px 10px 4px;text-transform:uppercase}
.ptbl th{font-size:12px;color:var(--muted);font-weight:700}
.pcard .k{font-size:12.5px;color:var(--muted)}
@media (max-width:430px){h1{font-size:24px!important}.sheet .hours{grid-template-columns:repeat(4,1fr)}}
/* 026 본문 안 링크·전화 링크 터치 영역 */
.foot a,.src-line a,.sheet .kv a,.sub a{display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
/* 027(2026-11-03 피트 검토 반영): 병원 화면 — 필터 잘림·하단 가림·한글 가독성·확인 중 표시·사진 톤 */
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 6px;margin-top:8px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding:2px 28px 6px 2px;margin-top:10px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.chips-scroll::-webkit-scrollbar{display:none}
.wrap{padding-bottom:calc(136px + env(safe-area-inset-bottom))!important}
#view .lift{word-break:keep-all;overflow-wrap:anywhere}
#view .foot{font-size:12.5px;line-height:1.75;text-align:left;word-break:keep-all;overflow-wrap:anywhere;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:20px}
.navi{font-size:12.5px!important;font-weight:800!important;letter-spacing:-.2px}
.hs-sub{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere}
.hs-addr{display:block;color:var(--ink)}
.rv-note{margin-top:8px;padding:9px 12px;border-radius:10px;background:#FFF6E5;color:#8A5A00;font-size:13px;line-height:1.6;word-break:keep-all;border:1px solid #F3E2BD}
.rv-note b{font-size:13.5px}
.rv-meta{display:block;font-size:12.5px;color:#7A5200;margin-top:2px}
/* 사진 톤 통일: 5구 삽화를 같은 채도·명도로 맞추고 아래쪽을 아이보리로 부드럽게 */
.topscape img,.scape-img{filter:saturate(.9) contrast(1.02) brightness(.98)}
.topscape div::after{background:linear-gradient(180deg,rgba(250,247,241,0) 26%,rgba(250,247,241,.78) 64%,var(--ground) 100%)!important}
@media (max-width:360px){.navi{font-size:12px!important}}
/* 028: AI 표기·안전 영역·핵심 메뉴 */
.scape{position:relative}
.img-tag{position:absolute;right:10px;top:10px;z-index:1;font-size:11px;font-weight:700;color:var(--navy-ink);background:rgba(255,255,255,.82);border:1px solid rgba(31,42,68,.12);padding:3px 8px;border-radius:8px;pointer-events:none}
.topscape .img-tag{top:10px;right:10px}
/* 글과 사진이 겹치지 않는 안전 영역: 상단 그림 위 제목은 아래 44% 구간(덮개 불투명 .78 이상)에만 놓인다 */
.topscape:not([hidden]) + .wrap > .back:first-child + h1,.topscape:not([hidden]) + .wrap > h1:first-child{position:relative;z-index:1}
.home-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.home-menu .hm{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:16px;background:var(--paper);font:inherit;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm)}
.home-menu .hm.soon{background:var(--ivory-2);color:var(--muted);box-shadow:none;border-style:dashed}
.home-menu .hm small{font-size:10.5px;color:var(--gold-ink);font-weight:800}
@media (max-width:360px){.home-menu{gap:6px}.home-menu .hm{font-size:12px;padding:8px 2px}}
@media (max-width:375px){.brand-t{font-size:16px!important;letter-spacing:-.5px}.topbar-region{font-size:11px!important;padding:0 8px!important}}
/* ═══════════════════════════════════════════════════════════════
   아이랑 디자인 v3후보 (2026-11-04, 029 최종 디자인 기준안 반영 — 따뜻한 매거진·실사 AI 사진) — v2 뒤에 붙는다
   원칙: 사진은 상단 한 장(화면 가득)·로고와 제목을 사진 위에, 아래쪽은 아이보리 그라데이션으로 글자 대비 4.5:1 보장
         카드 안은 사진 최소 · 아이콘은 오렌지 선 아이콘 · 골드는 제목 옆 가는 선에만 · 터치 44px · 글자 확대
   사진: app/assets/scenes/<장면>-m.webp(800×615 폰) / -w.webp(1600×560 PC) — 전부 AI 생성(실제 기관·인물 아님), 화면에 표기
   ═══════════════════════════════════════════════════════════════ */
:root{--ivory:#FBF6EF;--ivory-2:#F3EBE0;--orange:#D9822B;--orange-ink:#B8641E;--peach:#FDE7D6;--gold:#C9A86A;--gold-ink:#8A6420;--line:#EADFD2;--muted:#6E645B;--ground:var(--ivory);--shadow:0 1px 2px rgba(120,80,40,.05),0 10px 24px -16px rgba(120,80,40,.3);--shadow-lg:0 2px 4px rgba(120,80,40,.05),0 18px 40px -20px rgba(120,80,40,.35)}
/* 홈 상단 사진: 화면 가득, 로고·제목은 사진 위 */
.hero-v3{position:relative;width:100vw;margin:-20px 0 0 calc(50% - 50vw);background:var(--ivory);border-radius:0!important;box-shadow:none!important}
.hero-v3 .ph{display:block;width:100%;height:clamp(300px,80vw,380px);object-fit:cover;object-position:center 32%;filter:saturate(1.22) contrast(1.08) brightness(1.03)}
.hero-v3::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,246,239,.6) 0,rgba(251,246,239,0) 16%);pointer-events:none}
.hero-v3 .top3 .brand-t,.hero-v3 .top3 div{text-shadow:0 0 10px rgba(251,246,239,.95),0 1px 0 rgba(251,246,239,.9)}
.hero-v3 .top3{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:9px;padding:12px 18px 0;max-width:560px;margin:0 auto}
.hero-v3 .top3 .chip{background:rgba(255,255,255,.9)}
.hero-v3 .img-tag{top:auto;bottom:auto}
.hero-v3 .t3{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:40px 0 8px;background:linear-gradient(180deg,rgba(251,246,239,0) 0,rgba(251,246,239,.94) 30%,var(--ivory) 100%)}
.hero-v3 .t3 .in{max-width:560px;margin:0 auto;padding:0 18px}
.hero-v3 .t3 .eyebrow3{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.3px;color:var(--orange-ink);margin-bottom:4px}
.hero-v3 .t3 h1{margin:0;font-size:26px!important;line-height:1.25;color:var(--navy);white-space:pre-line;word-break:keep-all}
.hero-v3 .t3 p{margin:6px 0 0;font-size:14px;color:#5F554C;line-height:1.55;word-break:keep-all}

const _norm = s => String(s || "").toLowerCase().replace(/\s+/g, "");
function viewFind(q) {
  const back = `<button class="back glass" onclick="history.back()" aria-label="뒤로">${icon.back}</button>`;
  const head = `${back}<h1 style="font-size:24px;font-weight:800;margin-top:14px">찾기</h1>

  if (!q) { $view.innerHTML = head + `<div class="lift empty" style="margin-top:14px">찾을 이름을 넣어 주세요.</div>`; return; }
  if (gated("hosp") && !HOSP) HOSP = { clinics: [], hospitals: [], er: [], held: 1 };   // 보류 자료는 통합 검색에서도 요청·표시하지 않음(2026-11-03 A안)
  if (gated("bene") && !BENE) BENE = { items: [], held: 1 };
  if (gated("acas") && !ACAS) ACAS = { academies: [], held: 1 };
  if (!ACAS || !HOSP || !BENE) { Promise.all([loadAcas().catch(() => 0), loadHosp(), loadBene()]).then(() => { if (location.hash.startsWith("#find")) render(); }); $view.innerHTML = head + `<div class="lift empty" style="margin-top:14px">찾는 중이에요…</div>`; return; }
  const n = _norm(q), hit = v => _norm(v).includes(n);
  const row = (icon, t, sub, href, onclick) => `<a class="lift" href="${href}" ${onclick ? `onclick="${onclick}"` : ""} style="display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none;min-height:56px"><span style="font-size:20px">${icon}</span><div style="min-width:0;flex:1"><div style="font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sub)}</div></div><span style="color:var(--muted)">›</span></a>`;
  const groups = [];
  const sc = ((DATA && DATA.schools) || []).filter(x => x.code && x.code.trim() && hit(x.name)).slice(0, 8);
  if (sc.length) groups.push(["학교", sc.map(x => row("🏫", x.name, x.address || "", "#school/" + x.code))]);
  const ac = ((ACAS && ACAS.academies) || []).filter(x => hit(x.n) || hit(x.dong) || hit(x.r)).slice(0, 10);
  if (ac.length) groups.push(["학원·교습소", ac.map(x => row("✏️", x.n, [x.dong, x.r].filter(Boolean).join(" · "), "#aca/" + x.id))]);
  const hs = [...((HOSP && HOSP.clinics) || []), ...((HOSP && HOSP.hospitals) || [])].filter(x => hit(x.n) || hit(x.k || "") || hit(String(x.d || ""))).slice(0, 10);
  if (hs.length) groups.push(["병원·의원", hs.map(x => row("🩺", x.n, [x.k, x.a].filter(Boolean).join(" · "), "#hosp", `hsQ='${esc(x.n).replace(/'/g, "")}';hsTab='clinic'`))]);
  const bn = ((BENE && BENE.items) || []).filter(x => hit(x.n) || hit(x.sum)).slice(0, 8);
  if (bn.length) groups.push(["혜택", bn.map(x => row("🎁", x.n, x.org || "", "#bene", `bnQ='${esc(x.n).replace(/'/g, "")}'`))]);

  return parts.length ? `출처 ${[...new Set(parts)].join(" / ")} · 공식 원문을 함께 확인해 주세요.` : "";
}

  const total = kinds.reduce((x, [k]) => x + cnt(k), 0);
  const shares = rows.filter(h => h.event && h.path === "지인-공유").reduce((x, h) => x + h.count, 0);
  return `<section class="section"><div class="sec-head"><h2>광고 성과 · ${esc(AD.name)}</h2><span style="font-size:12px;color:var(--muted)">최근 30일</span></div>

}

// 관리자 학원 분석: 아이 등록 때 고른 학원(익명 집계) + 학원 상세 조회 (최근 30일)

  const rows = A.hits30 || [];

  const pick = {}, view = {};
  rows.forEach(h => {

    else if (!h.event && h.path.startsWith("/aca/")) { const id = h.path.slice(5); view[id] = (view[id] || 0) + h.count; }

  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const listPage = rows.filter(h => !h.event && h.path === "/acas").reduce((a, h) => a + h.count, 0);
  const added = sum(pick);
  const tile = (label, v) => `<div class="stat" style="padding:12px 4px"><div class="k">${label}</div><div class="v" style="font-size:22px">${v.toLocaleString()}</div></div>`;
  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
  const acaRow = ([id, c], i) => { const a = find(id);
    return `<div class="row" style="gap:10px"><span style="min-width:0;flex:1"><b style="color:var(--muted);margin-right:6px">${i + 1}</b>${esc(a ? a.n : id)}<span style="display:block;font-size:11px;color:var(--muted);margin-top:2px">${esc(a ? [a.r, acaKind(a) !== a.r ? acaKind(a) : "", a.gu, a.dong].filter(Boolean).join(" · ") : "목록에 없는 학원")}</span></span><span class="val"><b>${c.toLocaleString()}</b></span></div>`; };
  const box = (items, empty) => items.length ? `<div class="lift card-pad">${items.join("")}</div>` : `<div class="lift empty">${empty}</div>`;
  // 분야·지역: 고른 학원은 3점, 조회는 1점으로 합쳐 관심도를 봄
  const group = key => { const g = {};
    const add = (o, w) => Object.entries(o).forEach(([id, c]) => { const a = find(id); const k = (a && key(a)) || "기타"; g[k] = (g[k] || 0) + c * w; });
    add(pick, 3); add(view, 1); return top(g, 8); };
  const bars = arr => { const mx = Math.max(1, ...arr.map(x => x[1]));
    return arr.length ? `<div class="lift card-pad">${arr.map(([k, v]) => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><span style="width:92px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><span style="flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden"><span style="display:block;height:100%;width:${Math.round(v / mx * 100)}%;background:var(--indigo)"></span></span><span style="width:34px;text-align:right;font-size:12px;font-weight:700">${v}</span></div>`).join("")}</div>` : `<div class="lift empty">아직 기록이 없어요.</div>`; };
  return `<section class="section"><div class="sec-head"><h2>학원 분석</h2><span style="font-size:12px;color:var(--muted)">최근 30일</span></div>

// 관리자 방문자 그래프: 일별(최근 30일) / 월별(최근 12개월)
let adminChart = "day", adminMonths = null, adminMonthsBusy = false;
function pickAdminChart(k) { adminChart = k; render(); }
function kstMonthStart(back) { const k = new Date(Date.now() + 9 * 3600e3); return new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth() - back, 1) - 9 * 3600e3); }
async function loadAdminMonths() {
  if (adminMonthsBusy) return; adminMonthsBusy = true;
  const iso = d => d.toISOString().slice(0, 19) + "Z";
  const end = iso(new Date(Math.ceil(Date.now() / 3600e3) * 3600e3));
  try {
    // 1) 12개월치 일별 방문자 → 기록이 있는 달 찾기
    const year = await gcApi("stats/total", { start: iso(kstMonthStart(11)), end });
    const has = new Set((year.stats || []).filter(d => d.daily > 0).map(d => d.day.slice(0, 7)));
    const months = [];
    for (let b = 11; b >= 0; b--) {
      const st = kstMonthStart(b), en = b === 0 ? end : iso(kstMonthStart(b - 1));
      const key = new Date(st.getTime() + 9 * 3600e3).toISOString().slice(0, 7);
      let total = 0;
      // 2) 기록이 있는 달만 그 달 전체 방문자(중복 제외)를 따로 받음 (1초에 4번 제한 → 0.6초 간격)
      if (has.has(key)) { await new Promise(r => setTimeout(r, 600)); total = ((await gcApi("stats/total", { start: iso(st), end: en })) || {}).total || 0; }
      months.push({ key, total });
    }
    adminMonths = { months };
  } catch (e) { adminMonths = { err: String(e.message || e) }; }
  adminMonthsBusy = false;
  if (location.hash === "#admin" && adminChart === "month") render();
}
function adminBars(rows, scroll) {

  const bars = rows.map(r => `<div style="${w};display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:10px;color:var(--muted)">${r.v || ""}</div>
      <div style="width:70%;height:${Math.max(3, Math.round(r.v / max * 110))}px;border-radius:6px 6px 3px 3px;background:${r.hi ? "linear-gradient(180deg,#FFB199,#FF7A59)" : "linear-gradient(180deg,#8C97FF,var(--indigo))"}"></div>
      <div style="font-size:10px;color:${r.hi ? "var(--coral-ink)" : "var(--muted)"};font-weight:${r.hi ? 800 : 400};white-space:nowrap">${r.l}</div></div>`).join("");
  return `<div class="lift" id="adminBars" style="padding:16px 10px 12px;display:flex;align-items:flex-end;gap:2px;height:170px;overflow-x:${scroll ? "auto" : "hidden"}">${bars}</div>`;
}
function adminChartHtml(A) {
  if (adminChart === "month") {
    if (!adminMonths) { setTimeout(loadAdminMonths, 0); return `<div class="lift empty">월별 통계를 불러오는 중이에요… (몇 초 걸려요)</div>`; }
    if (adminMonths.err) return `<div class="lift empty">월별 통계를 불러오지 못했어요.<br>${esc(adminMonths.err)}</div><button class="btn btn-soft" style="width:100%;height:42px;margin-top:8px" onclick="adminMonths=null;render()">다시 시도</button>`;
    const ms = adminMonths.months, sum = ms.reduce((a, m) => a + m.total, 0);
    const best = ms.reduce((a, m) => m.total > a.total ? m : a, ms[0]);
    return adminBars(ms.map((m, i) => ({ v: m.total, l: Number(m.key.slice(5)) + "월", hi: i === ms.length - 1 })), false) +
      `<p style="font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.6">한 달 방문 횟수(화면별로 셈) · 12개월 합 ${sum.toLocaleString()}명${best && best.total ? ` · 가장 많은 달 ${Number(best.key.slice(5))}월 ${best.total.toLocaleString()}명` : ""}<br>이번 달은 오늘까지 집계예요.</p>`;

}

// 홈 화면 앱인데 아이 정보가 비어 있으면: 사파리에서 쓰던 정보 가져오기 안내
function moveCard() {
  if (moveHasData() || store("edu.moveAsk") === "0") return "";
  return `<section class="section"><div class="lift" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
    <span class="tile t-mint" style="width:40px;height:40px;font-size:18px">📥</span>
    <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">사파리에서 등록한 아이가 있나요?</div><div style="font-size:12px;color:var(--muted);margin-top:2px">쓰던 정보를 그대로 가져올 수 있어요</div></div>
    <button class="btn btn-3d" style="height:38px;font-size:13px;padding:0 14px;flex:0 0 auto" onclick="openMovePaste()">가져오기</button>
    <button onclick="store('edu.moveAsk','0');render()" aria-label="닫기" style="border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 2px">×</button></div></section>`;
}
function openMovePaste() {
  closeInstall();
  const el = document.createElement("div");
  el.id = "installSheet";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "정보 가져오기");
  el.style.cssText = "position:fixed;inset:0;z-index:50;background:rgba(20,26,46,.45);display:flex;align-items:flex-end;justify-content:center";
  el.innerHTML = `<div style="background:#fff;width:min(560px,100%);border-radius:26px 26px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(20,26,46,.25);max-height:88vh;overflow:auto">
    <div style="display:flex;align-items:center;gap:12px"><div style="flex:1;font-size:18px;font-weight:800">정보 가져오기</div>
      <button onclick="closeInstall()" aria-label="닫기" style="border:0;background:#EEF0F6;width:34px;height:34px;border-radius:17px;font-size:18px;color:var(--muted);cursor:pointer">×</button></div>
    <div style="margin-top:10px;font-size:14px;line-height:1.7;color:var(--muted)">① 사파리(또는 크롬)에서 이 사이트를 열고 <b>앱처럼 쓰기</b>를 눌러요<br>② 초록색 칸의 <b>옮기기 코드 복사</b>를 눌러요<br>③ 여기로 돌아와 아래 칸에 붙여 넣어요</div>
    <textarea id="moveIn" rows="3" placeholder="여기에 코드를 붙여 넣어 주세요" style="width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:13px;resize:none"></textarea>
    <button class="btn btn-3d" style="width:100%;height:50px;margin-top:10px;font-size:15px" onclick="doMovePaste()">가져오기</button></div>`;
  el.addEventListener("click", e => { if (e.target === el) closeInstall(); });
  document.body.appendChild(el);
}
function doMovePaste() {
  const v = (document.getElementById("moveIn") || {}).value || "";
  if (moveHasData() && !confirmMove) { confirmMove = true; toast("지금 등록된 아이 정보가 바뀌어요. 한 번 더 누르면 가져와요"); return; }
  if (moveApply(v)) { store("edu.moved", "1"); closeInstall(); trackEvent("정보-옮기기"); toast("아이 정보를 가져왔어요"); go("home"); render(); }
  else toast("코드를 확인해 주세요. 처음부터 끝까지 그대로 붙여 넣어야 해요");
}
let confirmMove = false;
// 전체 메뉴 안의 안내 칸
function installGuide() {
  const d = devInfo();
  if (d.standalone) return `<div class="lift" style="padding:18px;font-size:14px;line-height:1.65"><b>✓ 지금 홈 화면 앱으로 쓰고 있어요.</b><br><span style="color:var(--muted)">홈 화면 아이콘을 누르면 바로 열려요.</span></div>`;
  return `<div class="lift" style="padding:18px;font-size:14px;line-height:1.65">홈 화면에 아이콘을 만들어 두면 <b>앱처럼 한 번에</b> 열려요.
    <button class="btn btn-3d" style="width:100%;height:52px;margin-top:12px;font-size:15px" onclick="openInstall()">📲 앱처럼 쓰기</button></div>`;
}
// 홈 화면 안내 카드 (누르면 바로 안내 창)
function homeInstall() {
  const d = devInfo();
  if (d.standalone) return moveCard();
  if (store("edu.installHide") === "1") return "";
  return `<section class="section"><div class="lift" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
    <span class="tile t-indigo" style="width:40px;height:40px;font-size:18px">📲</span>
    <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">앱처럼 쓰기</div><div style="font-size:12px;color:var(--muted);margin-top:2px">바탕화면 아이콘 하나로 바로 열려요</div></div>
    <button class="btn btn-3d" style="height:38px;font-size:13px;padding:0 14px;flex:0 0 auto" onclick="openInstall()">${d.inApp ? "크롬으로 열기" : "추가하기"}</button>
    <button onclick="store('edu.installHide','1');render()" aria-label="닫기" style="border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 2px">×</button></div></section>`;
}
async function doInstall() { if (!installEvt) return; closeInstall(); installEvt.prompt(); const ch = await installEvt.userChoice; if (ch && ch.outcome === "accepted") { trackEvent("앱-설치"); toast("홈 화면에 추가했어요"); } installEvt = null; render(); }
window.addEventListener("appinstalled", () => { installEvt = null; store("edu.installDone", "1"); closeInstall(); render(); });

document.querySelectorAll(".navi").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
window.addEventListener("hashchange", render);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });

async function loadSeats() {
  try {
    const res = await dataFetch(SEATS_URL);
    if (!res.ok) throw new Error(res.status);
    SEATS = await res.json(); store(KEY_SEATS, JSON.stringify(SEATS));
  } catch (e) { try { SEATS = JSON.parse(store(KEY_SEATS) || "null"); } catch (e2) { SEATS = null; } }
  if (DATA) render();
}
async function loadBooks() {
  try {
    const res = await dataFetch(BOOKS_URL);
    if (!res.ok) throw new Error(res.status);
    BOOKS = await res.json(); store(KEY_BOOKS, JSON.stringify(BOOKS));
  } catch (e) { try { BOOKS = JSON.parse(store(KEY_BOOKS) || "null"); } catch (e2) { BOOKS = null; } }
  if (DATA) render();
}
async function loadMeals() {
  try {
    const res = await dataFetch(MEALS_URL);
    if (!res.ok) throw new Error(res.status);
    MEALS = await res.json(); store("edu.meals", JSON.stringify(MEALS));
  } catch (e) { try { MEALS = JSON.parse(store("edu.meals") || "null"); } catch (e2) { MEALS = null; } }
  if (DATA) render();
}
async function loadEvents() {
  try {
    const res = await dataFetch(EVENTS_URL);
    if (!res.ok) throw new Error(res.status);
    EVENTS = await res.json(); store(KEY_EVENTS, JSON.stringify(EVENTS));
  } catch (e) { try { EVENTS = JSON.parse(store(KEY_EVENTS) || "null"); } catch (e2) { EVENTS = null; } }
  if (DATA) render();
}
async function load() {
  try { localStorage.setItem("airang.city", "{{key}}"); } catch (e) {}   // 037: 입구(/)의 '지난번에 본 도시 바로 가기'가 직접 들어온 경우도 기억하도록(같은 주소라 저장소 공유)
  await loadGate();   // 검문 상태 먼저(없으면 빈 객체 → 모든 메뉴 평소대로)
  loadSeats(); loadBooks(); loadEvents(); loadMeals(); loadWeather();
  try {
    const res = await dataFetch(DATA_URL);
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    store(KEY_DATA, JSON.stringify(DATA));
  } catch (e) {
    const saved = store(KEY_DATA);
    if (saved) { DATA = JSON.parse(saved); toast("인터넷 연결이 없어 저장된 정보를 보여드려요"); }
    else { $view.innerHTML = `<div class="loading">정보를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div>`; return; }
  }
  render();
{{#if yongin}}
  if (importedOld) toast("예전 주소에서 아이 정보를 옮겨 왔어요");
{{#else}}
{{/if}}
  reportKidAcas();
}
// 이 기능 전에 등록해 둔 아이 학원도 한 번만 집계 (학원 번호만 보내고, 아이·기기 정보는 보내지 않음)
function reportKidAcas() {
  if (store("edu.acaReported")) return;
  const ids = new Set(); kids().forEach(k => (k.acas || []).forEach(a => ids.add(a.id)));
  ids.forEach(id => trackEvent("학원등록/" + id));
  store("edu.acaReported", "1");
}
load();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {}));
  // 새 버전이 설치되면 한 번 자동으로 새로고침
  let swReloaded = false; const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (swReloaded || !hadSW) return; swReloaded = true; location.reload(); });
}
</script>
</body>
</html>
