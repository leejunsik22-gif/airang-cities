<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>문의하기 · 아이랑 대전</title>
<meta name="theme-color" content="#1F2A44">
<link rel="icon" href="../entry/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 아이랑 문의하기 v01후보 (2026-11-09, A안 시험) — 입구와 같은 색·글꼴·모서리 */
:root{--ivory:#FAF7F1;--ivory-2:#F2EDE3;--paper:#FFFFFF;--navy:#1F2A44;--navy-ink:#16203A;--navy-soft:#E6E9F1;--coral-ink:#A33D27;--coral-bg:#FBE9E3;--sage-ink:#2E5A4B;--sage-bg:#E6F0EB;--gold:#B8923E;--gold-ink:#6F5415;--gold-bg:#F7EEDC;--muted:#5B6274;--line:#E8E3D9;--shadow:0 1px 2px rgba(31,42,68,.05),0 10px 24px -16px rgba(31,42,68,.28)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--navy-ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 48px}
.top{display:flex;align-items:center;gap:10px}
.top img{width:44px;height:39px;object-fit:contain}
.top b{font-size:18px;font-weight:800;letter-spacing:-.3px}.top small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.back{margin-left:auto;display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:var(--navy);text-decoration:none;font-weight:700;font-size:13.5px;background:var(--navy-soft)}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:22px 2px 6px}
.lead{margin:0 2px 14px;color:var(--muted);font-size:14px}
.warn{background:var(--gold-bg);color:var(--gold-ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px;margin:0 0 16px;word-break:keep-all}
.card{background:var(--paper);border:1px solid rgba(31,42,68,.06);border-radius:20px;box-shadow:var(--shadow);padding:16px}
fieldset{border:0;margin:0;padding:0}
legend,.lb{display:block;font-weight:800;font-size:15px;margin:0 0 8px}
.kinds{display:grid;gap:8px}
.kind{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--paper)}
.kind input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy);flex:0 0 auto}
.kind b{display:block;font-size:15.5px}.kind small{display:block;color:var(--muted);font-size:12.5px;word-break:keep-all}
.kind:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.kind:has(input:focus-visible){outline:3px solid rgba(184,146,62,.6);outline-offset:2px}
.f{margin-top:18px}
textarea,input[type=email]{width:100%;font:inherit;font-size:16px;color:var(--navy-ink);border:1px solid #CFC7B8;border-radius:14px;background:var(--paper);padding:12px 14px}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{outline:3px solid rgba(184,146,62,.45);outline-offset:1px;border-color:var(--navy)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0;display:flex;gap:8px;word-break:keep-all}
.hint .cnt{margin-left:auto;white-space:nowrap}
.err{display:none;color:var(--coral-ink);background:var(--coral-bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700;font-size:14px}
.err.on{display:block}
.send{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:16px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.send:disabled{opacity:.6;cursor:default}
.send:focus-visible,.back:focus-visible{outline:3px solid rgba(184,146,62,.6);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{font-size:12.5px;color:var(--muted);margin:14px 2px 0;line-height:1.7;word-break:keep-all}
.done{text-align:center;padding:28px 18px}
.done .num{display:inline-block;margin:10px 0 4px;font-size:22px;font-weight:800;color:var(--sage-ink);background:var(--sage-bg);border-radius:12px;padding:6px 14px}
.done p{color:var(--muted);margin:6px 0 0;word-break:keep-all}
.done a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:18px;padding:0 18px;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
  <div class="top"><img src="../entry/img/logo-symbol.png" width="44" height="39" alt="아이랑 로고"><div><b>아이랑 대전</b><small>아이 키우는 집을 위한 동네 정보</small></div><a class="back" href="../entry/">처음으로</a></div>
  <main id="main">
    <h1>문의하기</h1>
    <p class="lead">고를 수 있는 문의는 세 가지예요. 메일 앱 없이 여기서 바로 보내져요.</p>
    <p class="warn" role="note">아이 이름·학교·건강 정보는 적지 말아 주세요.</p>
    <form id="f" class="card" novalidate>
      <fieldset>
        <legend>무엇을 문의하시나요?</legend>
        <div class="kinds">
          <label class="kind"><input type="radio" name="kind" value="fix"><span><b>정보 수정·오류 신고</b><small>틀린 정보를 알려 주시면 공식 자료를 확인한 뒤 고쳐요.</small></span></label>
          <label class="kind"><input type="radio" name="kind" value="use"><span><b>이용 문의</b><small>쓰는 방법, 불편한 점을 알려 주세요.</small></span></label>
          <label class="kind"><input type="radio" name="kind" value="ad"><span><b>광고·제휴 문의</b><small>검토한 뒤 회신해요. 광고는 ‘광고’ 표시가 붙은 별도 자리에만 싣고, 검색 순서는 바꾸지 않아요.</small></span></label>
        </div>
      </fieldset>
      <div class="f">
        <label class="lb" for="body">문의 내용</label>
        <textarea id="body" name="body" maxlength="2000" aria-describedby="body-hint" placeholder="문의 유형을 고르면 적을 내용을 알려 드려요."></textarea>
        <div class="hint" id="body-hint"><span id="guide">전화번호·주민등록번호는 적지 말아 주세요.</span><span class="cnt"><span id="cnt">0</span> / 2000자</span></div>
      </div>
      <div class="f">
        <label class="lb" for="reply">회신 이메일 <small style="font-weight:600;color:var(--muted)">(선택)</small></label>
        <input id="reply" name="reply" type="email" maxlength="254" autocomplete="email" inputmode="email" placeholder="답장이 필요할 때만 적어 주세요">
      </div>
      <div class="hp" aria-hidden="true"><label>웹사이트<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="err" id="err" role="alert"></div>
      <button class="send" id="send" type="submit">문의 보내기</button>
      <p class="note">회신 이메일은 답장에만 쓰고 다른 곳에 쓰지 않아요. 문의는 처리 완료 90일 뒤 이메일과 함께 지워요(처리하지 못한 문의도 1년 뒤 지워요).<br>아이랑은 공공기관이 아닌 민간이 만든 무료 서비스예요.</p>
    </form>
  </main>
</div>
<script>
// 2026-11-09 A안 시험: /api/inquiry 로 보냄(메일 발송 없음). 주소의 ?kind=fix|use|ad&gu=&screen= 로 미리 채움
const GUIDE = {
  fix: ["구·화면:\n틀린 내용:\n맞는 내용(아시면):\n확인할 수 있는 공식 자료 주소(있으면):", "공식 자료 주소를 함께 주시면 더 빨리 고칠 수 있어요."],
  use: ["", "쓰는 방법이나 불편한 점을 편하게 적어 주세요."],
  ad: ["업체명:\n담당자 이름·연락처:\n제안 내용:", "광고·제휴 문의에는 담당자 연락처를 적어도 돼요."],
};
const $ = (id) => document.getElementById(id);
const f = $("f"), body = $("body"), err = $("err"), send = $("send");
const q = new URLSearchParams(location.search);
const ctx = { gu: (q.get("gu") || "").slice(0, 20), screen: (q.get("screen") || "").slice(0, 40) };
function count() { $("cnt").textContent = [...body.value].length; }
let lastAuto = "";   // 자동으로 채운 양식 — 이용자가 고치지 않았을 때만 다른 유형 양식으로 바꿈
function pick(k, fill) {
  const g = GUIDE[k]; if (!g) return;
  $("guide").textContent = g[1] + (k === "ad" ? "" : " 전화번호·주민등록번호는 적지 말아 주세요.");
  if (fill && (!body.value.trim() || body.value === lastAuto)) {
    const where = [ctx.gu, ctx.screen].filter(Boolean).join(" / ");
    body.value = lastAuto = k === "fix" && where ? g[0].replace("구·화면:", "구·화면: " + where) : g[0]; count();
  }
}
f.addEventListener("change", (e) => { if (e.target.name === "kind") pick(e.target.value, true); });
body.addEventListener("input", count);
const k0 = q.get("kind"); if (GUIDE[k0]) { f.querySelector(`input[value="${k0}"]`).checked = true; pick(k0, true); }
function fail(msg, field) { err.textContent = msg; err.classList.add("on"); const el = field === "kind" ? f.querySelector("input[name=kind]") : field && $(field); if (el) el.focus(); }
f.addEventListener("submit", async (e) => {
  e.preventDefault(); err.classList.remove("on");
  const kind = (f.querySelector("input[name=kind]:checked") || {}).value;
  if (!kind) return fail("문의 유형을 골라 주세요.", "kind");
  if (!body.value.trim() || (lastAuto && body.value === lastAuto)) return fail("문의 내용을 적어 주세요.", "body");
  if ([...body.value].length > 2000) return fail("문의 내용은 2000자까지 쓸 수 있어요.", "body");
  if ($("reply").value.trim() && !$("reply").checkValidity()) return fail("회신 이메일 형식을 확인해 주세요. (비워 두어도 돼요)", "reply");
  send.disabled = true; send.textContent = "보내는 중…";
  try {
    const r = await fetch("/api/inquiry", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind, body: body.value, reply: $("reply").value, gu: ctx.gu, screen: ctx.screen, website: f.website.value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw Object.assign(new Error(d.msg || "지금은 보낼 수 없어요. 잠시 뒤 다시 시도해 주세요."), { field: d.field });
    $("main").innerHTML = `<div class="card done" role="status"><h1 style="margin:0">문의가 접수됐어요</h1><div class="num">접수 번호 ${Number(d.ticket) || "-"}</div>
      <p>${$("reply").value.trim() ? "적어 주신 이메일로 답장을 드릴게요." : "회신 이메일이 없어서 답장은 드리지 못해요. 고친 내용은 앱에서 확인해 주세요."}</p><a href="../entry/">처음으로</a></div>`;
    window.scrollTo(0, 0); document.querySelector(".done h1").setAttribute("tabindex", "-1"); document.querySelector(".done h1").focus();
  } catch (x) {
    fail(x.message || "인터넷 연결을 확인하고 다시 보내 주세요.", x.field);
    send.disabled = false; send.textContent = "문의 보내기";
  }
});
count();
</script>
</body></html>
