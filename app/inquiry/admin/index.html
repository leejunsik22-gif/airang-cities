<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>문의 접수함 · 아이랑 관리자</title>
<link rel="icon" href="../../entry/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 아이랑 문의 접수함 v01후보 (2026-11-09, A안 시험) — Cloudflare Access 로그인 뒤에서만 열림 */
:root{--ivory:#FAF7F1;--ivory-2:#F2EDE3;--paper:#FFFFFF;--navy:#1F2A44;--navy-ink:#16203A;--navy-soft:#E6E9F1;--coral-ink:#A33D27;--coral-bg:#FBE9E3;--sage-ink:#2E5A4B;--sage-bg:#E6F0EB;--gold-ink:#6F5415;--gold-bg:#F7EEDC;--muted:#5B6274;--line:#E8E3D9;--shadow:0 1px 2px rgba(31,42,68,.05),0 10px 24px -16px rgba(31,42,68,.28)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--navy-ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 18px 48px}
.top{display:flex;align-items:center;gap:10px}.top img{width:44px;height:39px;object-fit:contain}
.top b{font-size:18px;font-weight:800}.top small{display:block;font-size:11px;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:18px 2px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.tab{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--navy);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab .n{font-size:12px;opacity:.8;margin-left:4px}
.msg{padding:18px;text-align:center;color:var(--muted)}
.item{background:var(--paper);border:1px solid rgba(31,42,68,.06);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
.item .h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-weight:800;font-size:12.5px;background:var(--ivory-2);color:var(--navy)}
.pill.s0{background:var(--coral-bg);color:var(--coral-ink)}.pill.s1{background:var(--gold-bg);color:var(--gold-ink)}.pill.s2{background:var(--sage-bg);color:var(--sage-ink)}
.item .when{margin-left:auto;color:var(--muted);font-size:12.5px}
.item pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:10px 0 6px}
.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.acts select{min-height:44px;font:inherit;border:1px solid #CFC7B8;border-radius:12px;padding:0 10px;background:var(--paper)}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.btn.del{background:var(--paper);color:var(--coral-ink);border:1px solid var(--coral-bg);margin-left:auto}
.btn.del.sure{background:var(--coral-ink);color:#fff}
.btn:focus-visible,.tab:focus-visible,select:focus-visible{outline:3px solid rgba(184,146,62,.6);outline-offset:2px}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;display:none}
.toast.on{display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:18px}
/* v02 로그인(카드 없는 무료 방식) */
.today[hidden]{display:none}
.btn.out{margin-left:auto;background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.login{background:var(--paper);border:1px solid rgba(31,42,68,.06);border-radius:18px;box-shadow:var(--shadow);padding:18px 16px;margin-top:6px}
.login label{display:block;font-weight:800;margin-bottom:8px}
.login input{width:100%;min-height:48px;font:inherit;font-size:16px;border:1px solid #CFC7B8;border-radius:14px;padding:0 14px}
.login .btn{width:100%;margin-top:12px;min-height:50px}
.login .err{color:var(--coral-ink);background:var(--coral-bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700;display:none}
.login .err.on{display:block}
.login small{display:block;color:var(--muted);margin-top:10px}
/* 11/9 피트 의견: 매일 확인 — '새 문의' 건수·목록을 맨 먼저, 곧 삭제될 미처리 문의 따로 표시 */
.today{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid rgba(31,42,68,.06);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 12px}
.today .big{font-size:30px;font-weight:800;color:var(--coral-ink);line-height:1}
.today .big.zero{color:var(--sage-ink)}
.today small{display:block;color:var(--muted);font-size:12.5px}
.soonbar{display:none;width:100%;text-align:left;min-height:48px;margin:0 0 12px;padding:10px 14px;border-radius:14px;border:1px solid #E9C98B;background:var(--gold-bg);color:var(--gold-ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.soonbar.on{display:block}
.pill.dd{background:var(--gold-bg);color:var(--gold-ink)}
</style></head><body>
<div class="wrap">
  <div class="top"><img src="../../entry/img/logo-symbol.png" width="44" height="39" alt="아이랑 로고"><div><b>아이랑 문의 접수함</b><small>관리자 전용 · 메일 발송 없음</small></div><button class="btn out" id="logout" type="button" hidden>로그아웃</button></div>
  <h1>문의 접수함</h1>
  <div class="today" id="today" aria-live="polite" hidden><span class="big" id="newN">-</span><div><b>새 문의</b><small>아직 확인하지 않은 문의예요.</small></div></div>
  <button class="soonbar" id="soonbar" type="button"></button>
  <div class="tabs" id="tabs" role="tablist" aria-label="처리 상태로 보기"></div>
  <div id="list" aria-live="polite"><p class="msg">불러오는 중…</p></div>
  <div class="pager" id="pager"></div>
  <p class="note">완료된 문의는 90일 뒤, 처리하지 못한 문의도 180일 뒤 자동으로 지워져요(30일 전부터 위에 따로 알려 드려요). 답장은 회신 주소를 눌러 대표 메일 앱에서 보내 주세요.</p>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const STATES = ["새 문의", "처리 중", "완료"];
let view = { state: "새 문의", page: 1, soon: false };   // 처음 열면 새 문의부터
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }
async function api(method, data) {
  const qs = method === "GET" ? `?${new URLSearchParams({ ...(view.soon ? { soon: 1 } : view.state && { state: view.state }), page: view.page })}` : "";
  const r = await fetch("/api/inquiry/admin" + qs, { method, credentials: "same-origin", headers: data ? { "content-type": "application/json" } : {}, body: data ? JSON.stringify(data) : undefined });
  const d = await r.json().catch(() => ({ ok: false, msg: "응답을 읽을 수 없어요." }));
  if (!r.ok || !d.ok) throw Object.assign(new Error(d.msg || "잠시 뒤 다시 시도해 주세요."), { status: r.status });
  return d;
}
let seq = 0;   // 늦게 도착한 이전 목록이 새 목록을 덮지 않게(빠르게 탭을 바꿀 때)
async function load() {
  let d; const my = ++seq;
  try { d = await api("GET"); if (my !== seq) return; } catch (e) { if (my !== seq) return; $("tabs").innerHTML = ""; $("pager").innerHTML = ""; $("today").hidden = true; $("soonbar").classList.remove("on"); $("logout").hidden = true;
    if (e.status === 401) return showLogin();
    $("list").innerHTML = `<p class="msg">${esc(e.message)}</p>`; return; }
  $("today").hidden = false; $("logout").hidden = false;
  const all = STATES.reduce((a, s) => a + (d.counts[s] || 0), 0);
  const nn = d.counts["새 문의"] || 0; $("newN").textContent = nn; $("newN").classList.toggle("zero", !nn);
  const sb = $("soonbar"); sb.classList.toggle("on", !!d.soon || view.soon);
  sb.textContent = view.soon ? "← 곧 삭제될 문의 보기를 닫기" : `⏳ ${d.warnDays}일 안에 자동 삭제될 미처리 문의 ${d.soon}건 — 눌러서 확인`;
  $("tabs").innerHTML = [...STATES.map((s) => [s, s, d.counts[s] || 0]), ["", "전체", all]].map(([v, l, n]) => { const on = !view.soon && view.state === v;
    return `<button class="tab ${on ? "on" : ""}" role="tab" aria-selected="${on}" data-s="${esc(v)}">${l}<span class="n">${n}</span></button>`; }).join("");
  $("list").innerHTML = d.items.length ? d.items.map((r) => `
    <article class="item" data-id="${r.id}">
      <div class="h"><b>#${r.id}</b><span class="pill">${esc(r.kind)}</span><span class="pill s${STATES.indexOf(r.state)}">${esc(r.state)}</span>${r.delete_in_days != null && r.delete_in_days <= d.warnDays ? `<span class="pill dd">${r.delete_in_days}일 뒤 삭제</span>` : ""}<span class="when">${when(r.created_at)}</span></div>
      <pre>${esc(r.body)}</pre>
      <div class="meta">${r.gu || r.screen ? `보낸 화면: ${esc([r.gu, r.screen].filter(Boolean).join(" / "))} · ` : ""}회신 주소: ${r.reply ? `<a href="mailto:${esc(encodeURIComponent(r.reply).replace(/%40/, "@"))}?subject=${encodeURIComponent(`[아이랑] 문의 #${r.id} 답변`)}">${esc(r.reply)}</a>` : "없음"}</div>
      <div class="acts"><label class="sr" for="st-${r.id}" style="font-weight:700;font-size:13.5px">처리 상태</label>
        <select id="st-${r.id}">${STATES.map((s) => `<option${s === r.state ? " selected" : ""}>${s}</option>`).join("")}</select>
        <button class="btn save" type="button">상태 저장</button><button class="btn del" type="button">삭제</button></div>
    </article>`).join("") : `<p class="msg">문의가 없어요.</p>`;
  $("pager").innerHTML = d.pages > 1 ? `<button class="btn" data-p="${d.page - 1}" ${d.page <= 1 ? "disabled" : ""}>이전</button><span>${d.page} / ${d.pages}쪽</span><button class="btn" data-p="${d.page + 1}" ${d.page >= d.pages ? "disabled" : ""}>다음</button>` : "";
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) { view = { state: b.dataset.s, page: 1, soon: false }; load(); } });
$("soonbar").addEventListener("click", () => { view = view.soon ? { state: "새 문의", page: 1, soon: false } : { state: "", page: 1, soon: true }; load(); });
$("pager").addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (b && !b.disabled) { view.page = +b.dataset.p; load(); } });
$("list").addEventListener("click", async (e) => {
  const item = e.target.closest(".item"); if (!item) return; const id = +item.dataset.id;
  try {
    if (e.target.closest(".save")) { await api("POST", { action: "state", id, state: item.querySelector("select").value }); toast(`#${id} 상태를 저장했어요`); load(); }
    const del = e.target.closest(".del");
    if (del) {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "정말 삭제"; setTimeout(() => { del.classList.remove("sure"); del.textContent = "삭제"; }, 4000); return; }
      await api("POST", { action: "delete", id }); toast(`#${id} 문의를 지웠어요`); load();
    }
  } catch (x) { toast(x.message); }
});
function showLogin(msg) {
  $("list").innerHTML = `<form class="login" id="login"><label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">로그인</button><div class="err" id="lerr" role="alert"></div>
    <small>대표만 쓰는 화면이에요. 비밀번호를 여러 번 틀리면 15분 동안 잠겨요.</small></form>`;
  $("pw").focus();
  $("login").addEventListener("submit", async (e) => {
    e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true;
    try {
      const r = await fetch("/api/inquiry/login", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.msg || "로그인할 수 없어요.");
      view = { state: "새 문의", page: 1, soon: false }; load();
    } catch (x) { $("lerr").textContent = x.message; $("lerr").classList.add("on"); $("pw").select(); b.disabled = false; }
  });
}
$("logout").addEventListener("click", async () => { await fetch("/api/inquiry/login", { method: "DELETE", credentials: "same-origin" }); load(); });
load();
</script>
</body></html>
